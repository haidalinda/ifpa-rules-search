":["ticket","tickets","entry","entries","reentry","re-entry","unlimited entry"],"add":"ticket disqualified replacement tickets entries"},{"when":["score photo","wrong score","score is wrong","misread score","misrecorded","score was wrong","recorded wrong","typo in score"],"add":"tampering with recorded results scorekeeper recorded score adjust scores obvious error"},{"when":["scoop","saucer","popper","kickout hole","kick out hole","vuk","up kicker","upkicker","subway"],"add":"stuck ball free the ball"},{"when":["shooter lane"],"add":"plunger lane"},{"when":["slingshot","bumper","pop bumper","spinner","drop target","standup target","stand up target","loop","orbit"],"add":"major playfield feature ceases to function malfunction"}]</script>
<script>
(function(){
'use strict';
var DATA = JSON.parse(document.getElementById('rb-data').textContent);
var VOCAB = JSON.parse(document.getElementById('rb-vocab').textContent);
var SECTIONS = DATA.sections;
var SEC_BY_ID = {};
SECTIONS.forEach(function(s,i){ SEC_BY_ID[s.id]=i; });

/* ---------- text normalising, stemming ---------- */
var STOP = new Set(('a an the of in on at to for and or is are was were be been being it its this that these those with as by from if '+
  'then than so do does did not no can may will shall should must has have had you your i we they he she them their his her there here '+
  'when while which who whom what any all some such into out up over under also but about just how').split(' '));
function normalize(s){
  return s.toLowerCase()
    .replace(/[’‘`]/g,"'").replace(/'/g,'')
    .replace(/multi[\s\-]+ball/g,'multiball')
    .replace(/score[\s\-]+keeper/g,'scorekeeper')
    .replace(/jack[\s*\-]*bot/g,'jackbot')
    .replace(/spider[\s\-]+man/g,'spiderman')
    .replace(/auto[\s\-]+plunger/g,'autoplunger')
    .replace(/bang[\s\-]+back/g,'bangback');
}
function words(s){ return normalize(s).split(/[^a-z0-9]+/).filter(Boolean); }
function undouble(w){ return /([^aeioulsz])\1$/.test(w) ? w.slice(0,-1) : w; }
function stem(w){
  if (w.length < 4) return w;
  if (w.length > 4 && w.slice(-3) === 'ies') w = w.slice(0,-3)+'y';
  else if (/(sses|shes|ches|xes|zes)$/.test(w)) w = w.slice(0,-2);
  else if (w.slice(-1) === 's' && !/(ss|us|is)$/.test(w)) w = w.slice(0,-1);
  if (w.length > 5 && w.slice(-2) === 'ly') w = w.slice(0,-2);
  if (w.length > 5 && w.slice(-3) === 'ing') w = undouble(w.slice(0,-3));
  else if (w.length > 4 && w.slice(-2) === 'ed') w = undouble(w.slice(0,-2));
  if (w.length > 3 && w.slice(-1) === 'e') w = w.slice(0,-1);
  return w;
}
function toks(s){ var o=[]; words(s).forEach(function(w){ if(!STOP.has(w)) o.push(stem(w)); }); return o; }
function uniq(a){ return Array.from(new Set(a)); }

/* ---------- index (BM25 over passages) ---------- */
var CH = [];
SECTIONS.forEach(function(s,si){ s.chunks.forEach(function(c,ci){ CH.push({si:si, ci:ci, text:c.t}); }); });
var N = CH.length, post = new Map(), dlen = [], totalLen = 0;
CH.forEach(function(c,d){
  c.tt = toks(SECTIONS[c.si].title); c.xt = toks(c.text);
  dlen[d] = c.xt.length; totalLen += c.xt.length;
  function bump(t,k){ var m=post.get(t); if(!m){ m=new Map(); post.set(t,m); } var e=m.get(d); if(!e){ e=[0,0]; m.set(d,e); } e[k]++; }
  c.tt.forEach(function(t){ bump(t,0); }); c.xt.forEach(function(t){ bump(t,1); });
});
var AVG = totalLen / N, K1 = 1.2, B = 0.75, TITLE_W = 3;
var VOC = Array.from(post.keys());
var idfCache = new Map();
function idf(t){ var v=idfCache.get(t); if(v===undefined){ var df=post.get(t).size; v=Math.log(1+(N-df+0.5)/(df+0.5)); idfCache.set(t,v);} return v; }
function bm25(t,d){
  var e = post.get(t).get(d); if(!e) return 0;
  var i = idf(t), s = 0;
  if (e[1]) s += i*e[1]*(K1+1)/(e[1]+K1*(1-B+B*dlen[d]/AVG));
  if (e[0]) s += i*TITLE_W*(e[0]*(K1+1)/(e[0]+K1));
  return s;
}
function editDist(a,b,max){
  var m=a.length, n=b.length; if (Math.abs(m-n) > max) return max+1;
  var prev2=null, prev=[], cur, i, j;
  for (j=0;j<=n;j++) prev[j]=j;
  for (i=1;i<=m;i++){
    cur=[i]; var rowMin=i;
    for (j=1;j<=n;j++){
      var c = a[i-1]===b[j-1] ? 0 : 1;
      var v = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+c);
      if (i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) v = Math.min(v, prev2[j-2]+1);
      cur[j]=v; if (v<rowMin) rowMin=v;
    }
    if (rowMin>max) return max+1;
    prev2=prev; prev=cur;
  }
  return prev[n];
}
function variants(q, fuzzy){
  var out=[], seen=new Set();
  if (post.has(q)){ out.push([q,1]); seen.add(q); }
  if (q.length>=3){ VOC.forEach(function(t){ if(t!==q && t.indexOf(q)===0 && !seen.has(t)){ out.push([t,0.6]); seen.add(t); } }); }
  if (fuzzy && q.length>=5 && !post.has(q)){
    var md = q.length>=9 ? 2 : 1;
    VOC.forEach(function(t){ if(!seen.has(t) && Math.abs(t.length-q.length)<=md && editDist(q,t,md)<=md){ out.push([t,0.45]); seen.add(t); } });
  }
  return out;
}
function scoreChunks(terms, fuzzy){
  var scores = new Map(), matched = new Map();
  terms.forEach(function(q){
    var best = new Map();
    variants(q,fuzzy).forEach(function(v){
      post.get(v[0]).forEach(function(e,d){ var s=v[1]*bm25(v[0],d); if (s>(best.get(d)||0)) best.set(d,s); });
    });
    best.forEach(function(s,d){ scores.set(d,(scores.get(d)||0)+s); matched.set(d,(matched.get(d)||0)+1); });
  });
  scores.forEach(function(s,d){ scores.set(d, s*(0.5+0.5*matched.get(d)/terms.length)); });
  for (var i=0;i+1<terms.length;i++){
    var a=terms[i], b=terms[i+1];
    scores.forEach(function(s,d){
      var x=CH[d].xt; for (var k=0;k+1<x.length;k++){ if (x[k]===a && x[k+1]===b){ scores.set(d, scores.get(d)+1.5); break; } }
    });
  }
  return scores;
}

/* ---------- pinball vocabulary (query-time synonyms) ---------- */
VOCAB.forEach(function(e){ e.seqs = e.when.map(function(w){ return words(w).map(stem); }); });
function containsSeq(hay, needle){
  if (!needle.length) return false;
  for (var i=0;i+needle.length<=hay.length;i++){ var ok=true; for (var j=0;j<needle.length;j++){ if (hay[i+j]!==needle[j]){ ok=false; break; } } if (ok) return true; }
  return false;
}
function expansions(q){
  var qw = words(q).map(stem), out=[];
  VOCAB.forEach(function(e){ if (e.seqs.some(function(s){ return containsSeq(qw,s); })) out.push(e.add); });
  return out;
}

/* ---------- search ---------- */
var ROMAN = {i:'I', ii:'II', iii:'III', iv:'IV'};
function parseId(qn){
  var m = /^(?:section\s+|rule\s+)?(iv|iii|ii|i)\s*\.?\s*(\d{1,2})$/.exec(qn.trim());
  if (!m) return null; var id = ROMAN[m[1]]+'.'+m[2];
  return id in SEC_BY_ID ? id : null;
}
/* words that appear in a big share of the rulebook (e.g. "ball") are not highlighted unless they are all that was typed */
function pickHl(terms){
  var keep = terms.filter(function(t){ var m=post.get(t); return !m || m.size/N < 0.2; });
  return keep.length ? keep : terms;
}
function search(q){
  q = (q||'').trim();
  var terms = toks(q), idm = parseId(normalize(q));
  var res = { results:[], terms:terms, hl:pickHl(terms), expTerms:[], exact:idm };
  if (!terms.length && !idm) return res;
  var prim = terms.length ? scoreChunks(terms,true) : new Map();
  var exps = terms.length ? expansions(q) : [];
  var expTerms = exps.length ? uniq(toks(exps.join(' '))) : [];
  var exp = expTerms.length ? scoreChunks(expTerms,false) : new Map();
  var scale = expTerms.length ? 0.8*Math.min(terms.length,3)/Math.max(1,expTerms.length)*1.8 : 0;
  var comb = new Map();
  prim.forEach(function(s,d){ comb.set(d,s); });
  exp.forEach(function(s,d){ comb.set(d,(comb.get(d)||0)+s*scale); });
  var bySec = new Map();
  comb.forEach(function(s,d){ var si=CH[d].si; if(!bySec.has(si)) bySec.set(si,[]); bySec.get(si).push({d:d, ci:CH[d].ci, score:s}); });
  var list = [];
  bySec.forEach(function(ch,si){
    ch.sort(function(a,b){ return b.score-a.score; });
    list.push({ si:si, id:SECTIONS[si].id, score: ch[0].score + 0.25*(ch[1]?ch[1].score:0), chunks:ch });
  });
  list.sort(function(a,b){ return b.score-a.score; });
  var top = list.length ? list[0].score : 0;
  list = list.filter(function(r){ return r.score >= 0.25*top; }).slice(0,10);
  if (idm){
    list = list.filter(function(r){ return r.id!==idm; });
    list.unshift({ si:SEC_BY_ID[idm], id:idm, score:Infinity, exact:true, chunks:[] });
  }
  res.results = list; res.expTerms = expTerms;
  return res;
}

/* ---------- rendering ---------- */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hitWord(w, stems){
  var n = normalize(w); if (!n || STOP.has(n)) return false; var s = stem(n);
  for (var i=0;i<stems.length;i++){ var q=stems[i]; if (s===q || (q.length>=3 && s.indexOf(q)===0)) return true; }
  return false;
}
function hl(text, stems){
  if (!stems.length) return esc(text);
  var out='', last=0, re=/[A-Za-z0-9]+/g, m;
  while ((m = re.exec(text))){
    out += esc(text.slice(last,m.index));
    out += hitWord(m[0],stems) ? '<mark>'+esc(m[0])+'</mark>' : esc(m[0]);
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}
function snippet(text, stems, expStems){
  var sents = text.split(/(?<=[.!?])\s+/);
  if (sents.length===1 && text.length<=300) return hl(text, stems);
  var best=0, bestScore=-1;
  sents.forEach(function(s,i){
    var sc=0; (s.match(/[A-Za-z0-9]+/g)||[]).forEach(function(w){ if (hitWord(w,stems)) sc+=2; else if (hitWord(w,expStems)) sc+=1; });
    if (sc>bestScore){ bestScore=sc; best=i; }
  });
  var out = sents[best];
  if (out.length<150 && sents[best+1]) out += ' ' + sents[best+1];
  var pre = best>0 ? '… ' : '', post2 = (best+1 < sents.length && out.length < text.length) ? ' …' : '';
  return pre + hl(out, stems) + post2;
}
function termText(text, re){
  var g = new RegExp(re.source, 'gi'), out = '', last = 0, m;
  while ((m = g.exec(text))){
    if (!m[0]) { g.lastIndex++; continue; }
    out += richText(text.slice(last, m.index), []) + '<mark>' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
  }
  return out + richText(text.slice(last), []);
}
var TITLE_LINK = {};
SECTIONS.forEach(function(s){ TITLE_LINK[s.title]=s.id; });
Object.keys(DATA.parts).forEach(function(p){ var first = SECTIONS.filter(function(s){ return s.part===p; })[0]; if (first && !TITLE_LINK[DATA.parts[p]]) TITLE_LINK[DATA.parts[p]] = first.id; });
function richText(text, stems){
  var out='', last=0, re=/“([^”]+)”/g, m;
  while ((m = re.exec(text))){
    var id = TITLE_LINK[m[1]];
    if (!id) continue;
    out += hl(text.slice(last,m.index), stems) + '<a href="#s/'+id+'">“'+hl(m[1],stems)+'”</a>';
    last = m.index + m[0].length;
  }
  return out + hl(text.slice(last), stems);
}

var $q = document.getElementById('q'), $main = document.getElementById('main'), $field = document.getElementById('field');
document.getElementById('ver').textContent = DATA.version;
document.getElementById('foot').innerHTML = DATA.footer;
var secCtx = null;
var lastQuery = '', lastSearch = null, savedY = 0, restoreY = null;

var SUGGEST_POOL = ['stuck ball in multiball','slam tilt','out of turn','lazarus','death save','bangback','kickback','ball save','tilt warning','tilting','disqualified','slow play','no show','coaching','yellow card','score rolled over','wrong number of players','extra balls setting','betting on a game','kicked the machine','known malfunction','stuck flipper','machine crashed','ball on top of the center post'];
function pickSuggest(){ var a = SUGGEST_POOL.slice(); for (var i = a.length-1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a.slice(0,4); }
var SUGGEST = pickSuggest();

var TOPICS = DATA.topics || [], TOPIC_BY_ID = {}, SEC_TOPICS = {}, TOPIC_GROUP = {};
TOPICS.forEach(function(g){ g.topics.forEach(function(t){
  TOPIC_BY_ID[t.id] = t; TOPIC_GROUP[t.id] = g.group;
  t.sections.forEach(function(id){ (SEC_TOPICS[id] = SEC_TOPICS[id] || []).push(t.id); });
}); });
var topicView = null, filters = new Set();
function firstSentence(t){
  t = t.replace(/^\(?[A-Za-z0-9]{1,2}[.)]\s+/, '');
  return t.split(/(?<=[.!?])\s+/)[0];
}
function topicsHtml(){
  var h = '<div class="toc topics"><h2 class="label">Browse by topic</h2>';
  TOPICS.forEach(function(g){
    h += '<h3 class="tgroup">'+esc(g.group)+'</h3>';
    g.topics.forEach(function(t){
      h += '<a class="trow" href="#t/'+t.id+'"><span class="tn">'+esc(t.name)+'</span><small>'+t.sections.length+'</small></a>';
    });
  });
  return h + '</div>';
}
function sectionCard(id, bodyHtml, meta){
  var s = SECTIONS[SEC_BY_ID[id]];
  return '<a class="card" href="#s/'+id+'"><div class="card-head"><span class="sid">'+esc(id)+'</span><span class="stitle">'+esc(s.title)+'</span></div>'+bodyHtml+(meta?'<div class="meta">'+meta+'</div>':'')+'</a>';
}
function renderTopic(id){
  var t = TOPIC_BY_ID[id];
  if (!t){ topicView = null; return false; }
  var h = '<a class="back tback" href="#">← Topics</a><h1 class="sec-title">'+esc(t.name)+'</h1><p class="sec-part">'+esc(TOPIC_GROUP[id])+'</p>';
  t.sections.forEach(function(sid){
    h += sectionCard(sid, '<div class="snip">'+esc(firstSentence(SECTIONS[SEC_BY_ID[sid]].chunks[0].t))+'</div>');
  });
  $main.innerHTML = h; window.scrollTo(0,0);
  return true;
}
var GLOSS = DATA.glossary || [], GLOSS_BY_ID = {}, gloss = null;
GLOSS.forEach(function(g){
  GLOSS_BY_ID[g.id] = g;
  g.re = new RegExp('\\b(?:'+g.aliases.map(function(a){ return a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }).join('|')+')\\b','i');
  g.keys = [g.term].concat(g.aliases).map(function(x){ return normalize(x).trim(); });
});
function glossPreview(g){ return g.kind==='rules' ? firstSentence(g.text) : g.meaning; }
function glossUsage(g){
  var out = [];
  SECTIONS.forEach(function(s){
    var n = 0; s.chunks.forEach(function(c){ if (g.re.test(c.t)) n++; });
    if (n) out.push({id:s.id, title:s.title, n:n});
  });
  return out;
}
function glossMatches(q){
  var qn = normalize(q).trim();
  if (qn.length < 3) return [];
  return GLOSS.filter(function(g){
    return g.keys.some(function(k){ return k===qn || (qn.length>=4 && k.indexOf(qn)===0); });
  }).slice(0,2);
}
function glossCard(g){
  return '<a class="card gcard" href="#g/'+g.id+'"><div class="card-head"><span class="stitle">'+esc(g.term)+'</span><span class="gtag">Glossary</span></div><div class="snip">'+esc(glossPreview(g))+'</div></a>';
}
function glossaryRow(){
  return '<div class="toc topics"><h3 class="tgroup">Glossary</h3><a class="trow" href="#g"><span class="tn">Pinball terms A–Z</span><small>'+GLOSS.length+'</small></a></div>';
}
function renderGlossary(){
  var h;
  if (gloss==='list' || !GLOSS_BY_ID[gloss]){
    gloss = 'list';
    h = '<a class="back gback" href="#">← Topics</a><h1 class="sec-title">Glossary</h1><p class="sec-part">Pinball terms A–Z</p><div class="toc topics qlist">';
    GLOSS.slice().sort(function(a,b){ return a.term.localeCompare(b.term); }).forEach(function(g){
      h += '<a class="trow" href="#g/'+g.id+'"><span class="tn">'+esc(g.term)+'</span>'+(g.kind==='rules'?'<small>'+esc(g.from)+'</small>':'')+'</a>';
    });
    $main.innerHTML = h + '</div>'; window.scrollTo(0,0);
    return true;
  }
  var e = GLOSS_BY_ID[gloss];
  h = '<a class="back gback" href="#">← Glossary</a><h1 class="sec-title">'+esc(e.term)+'</h1>';
  if (e.kind==='rules'){
    var s = SECTIONS[SEC_BY_ID[e.from]];
    h += '<blockquote class="gdef">'+esc(e.text)+'</blockquote><p class="sec-part">From <a href="#s/'+e.from+'">'+esc(e.from)+' '+esc(s.title)+'</a></p>';
  } else {
    h += '<p class="gmean">'+esc(e.meaning)+'</p><p class="sec-part">Common pinball term, not defined in the rules</p>';
  }
  var use = glossUsage(e);
  if (use.length){
    h += '<h2 class="label">Related sections</h2><div class="toc topics qlist">';
    use.forEach(function(u){ h += '<a class="trow" href="#s/'+u.id+'"><span class="tn"><span class="sid">'+esc(u.id)+'</span>'+esc(u.title)+'</span><small>'+u.n+'</small></a>'; });
    h += '</div>';
  }
  $main.innerHTML = h; window.scrollTo(0,0);
  return true;
}
function renderAck(){
  $main.innerHTML = '<a class="back aback" href="#">← Home</a><h1 class="sec-title">Acknowledgements</h1>'+DATA.ack; window.scrollTo(0,0);
}
var CHEAT = DATA.cheatsheet || [], CHEAT_BY_ID = {}, cheat = null;
CHEAT.forEach(function(c){ CHEAT_BY_ID[c.id] = c; });
function renderCheat(){
  var h;
  if (cheat==='list' || !CHEAT_BY_ID[cheat]){
    cheat = 'list';
    h = '<a class="back cback" href="#">← Home</a><h1 class="sec-title">Quick reference</h1><p class="sec-part">Common situations</p><div class="toc topics qlist">';
    CHEAT.forEach(function(c){ h += '<a class="trow" href="#c/'+c.id+'"><span class="tn">'+esc(c.situation)+'</span></a>'; });
    $main.innerHTML = h + '</div>'; window.scrollTo(0,0);
    return true;
  }
  var e = CHEAT_BY_ID[cheat];
  h = '<a class="back cback" href="#">← Quick reference</a><h1 class="sec-title">'+esc(e.situation)+'</h1>';
  e.items.forEach(function(it){
    var s = SECTIONS[SEC_BY_ID[it.from]];
    h += '<div class="csi"><blockquote class="gdef">'+esc(it.text)+'</blockquote><p class="sec-part"><a href="#s/'+it.from+'">'+esc(it.from)+' '+esc(s.title)+'</a></p></div>';
  });
  $main.innerHTML = h; window.scrollTo(0,0);
  return true;
}
function tocHtml(cur){
  var h = '<details class="allsec toc"><summary>All sections</summary>';
  Object.keys(DATA.parts).forEach(function(p){
    h += '<h3>'+esc(p)+'. '+esc(DATA.parts[p])+'</h3>';
    SECTIONS.filter(function(s){ return s.part===p; }).forEach(function(s){
      h += '<a href="#s/'+s.id+'" data-keep="1"'+(s.id===cur?' aria-current="true"':'')+'><span class="sid">'+esc(s.id)+'</span><span>'+esc(s.title)+'</span></a>';
    });
  });
  var about = SECTIONS.filter(function(s){ return s.part===''; });
  about.forEach(function(s){ h += '<a href="#s/'+s.id+'"><span class="sid">—</span><span>'+esc(s.title)+'</span></a>'; });
  return h + '</details>';
}
function renderSearch(){
  var q = $q.value;
  $field.classList.toggle('has', !!q);
  if (ack){ renderAck(); return; }
  if (cheat && renderCheat()) return;
  if (gloss && renderGlossary()) return;
  if (topicView && renderTopic(topicView)) return;
  if (!q.trim()){
    lastQuery=''; lastSearch=null; filters.clear();
    var n1 = SECTIONS[SEC_BY_ID['I.1']];
    var h = '<h2 class="label">Try a search</h2><div class="chips">';
    SUGGEST.forEach(function(s){ h += '<button type="button" class="chip" data-q="'+esc(s)+'">'+esc(s)+'</button>'; });
    h += '</div>';
    if (n1) h += '<h2 class="label">Read</h2><a class="card start" href="#s/I.1"><div class="card-head"><span class="sid">I.1</span><span class="stitle">'+esc(n1.title)+'</span></div><div class="snip">'+esc(firstSentence(n1.chunks[0].t))+'</div></a>';
    h += '<h2 class="label">Glossary</h2><a class="card" href="#g"><div class="card-head"><span class="stitle">Pinball terms A–Z</span></div></a>';
    h += '<h2 class="label">Quick reference</h2><a class="card" href="#c"><div class="card-head"><span class="stitle">Common situations</span></div></a>';
    $main.innerHTML = h + topicsHtml() + '' + tocHtml();
    return;
  }
  topicView = null; gloss = null; cheat = null;
  var r = search(q); lastQuery=q; lastSearch=r;
  var gh = glossMatches(q).map(glossCard).join('');
  if (!r.results.length){
    $main.innerHTML = gh + '<div class="note">No matches for “'+esc(q)+'”. Try fewer or different words, or use a word from the situation (for example “tilt”, “drain”, “stuck”).</div>' + tocHtml();
    return;
  }
  var counts = {};
  r.results.forEach(function(x){ (SEC_TOPICS[x.id]||[]).forEach(function(id){ counts[id]=(counts[id]||0)+1; }); });
  var h = gh;
  if (Object.keys(counts).length > 1 || filters.size){
    h += '<div class="tf"><div class="tfh"><h2 class="label">Narrow by topic</h2>'+(filters.size?'<button type="button" class="tclear">Clear</button>':'')+'</div><div class="chips">';
    TOPICS.forEach(function(g){ g.topics.forEach(function(t){ if (counts[t.id] || filters.has(t.id)) h += '<button type="button" class="tfchip" data-t="'+t.id+'" aria-pressed="'+(filters.has(t.id)?'true':'false')+'">'+esc(t.name)+'<small>'+(counts[t.id]||0)+'</small></button>'; }); });
    h += '</div></div>';
  }
  var shown = filters.size ? r.results.filter(function(x){ return (SEC_TOPICS[x.id]||[]).some(function(id){ return filters.has(id); }); }) : r.results;
  if (!shown.length){
    $main.innerHTML = h + '<div class="note">No matches for “'+esc(q)+'” in the selected topics. Tap Clear to see all results.</div>';
    return;
  }
  shown.forEach(function(x){
    var s = SECTIONS[x.si], body;
    if (x.exact || !x.chunks.length){
      body = '<div class="snip">'+hl(firstSentence(s.chunks[0].t), [])+'</div>';
    } else {
      var best = s.chunks[x.chunks[0].ci].t;
      body = '<div class="snip">'+snippet(best, r.hl, r.expTerms)+'</div>';
    }
    var n = x.chunks.length;
    h += '<a class="card" href="#s/'+x.id+'"><div class="card-head"><span class="sid">'+esc(x.id)+'</span><span class="stitle">'+esc(s.title)+'</span></div>'+body+
         '<div class="meta">'+(x.exact?'Section '+esc(x.id):(n+' matching passage'+(n===1?'':'s')))+'</div></a>';
  });
  $main.innerHTML = h;
}
function renderSection(id){
  var si = SEC_BY_ID[id];
  if (si===undefined){ current = null; renderSearch(); return; }
  var s = SECTIONS[si], stems = lastSearch ? lastSearch.hl : [];
  var hits = new Set(), bestCi = -1;
  if (lastSearch){
    var res = lastSearch.results.filter(function(r){ return r.id===id; })[0];
    if (res && res.chunks.length){
      var top = res.chunks[0].score; bestCi = res.chunks[0].ci;
      res.chunks.slice(0,3).forEach(function(c){ if (c.score>=0.75*top) hits.add(c.ci); });
    }
  }
  var ctx = secCtx && secCtx.id===id ? secCtx : null;
  if (ctx){ hits.clear(); bestCi = -1; }
  if (ctx && ctx.re){ s.chunks.some(function(c,ci){ if (new RegExp(ctx.re.source,'i').test(c.t)){ bestCi = ci; return true; } }); }
  if (ctx && ctx.quote){ s.chunks.forEach(function(c,ci){ if (c.t.indexOf(ctx.quote)>=0){ hits.add(ci); if (bestCi<0) bestCi = ci; } }); }
  var h = '<a class="back" href="#">← '+(lastQuery?'Results':(topicView&&TOPIC_BY_ID[topicView]?TOPIC_BY_ID[topicView].name:(cheat&&CHEAT_BY_ID[cheat]?CHEAT_BY_ID[cheat].situation:(gloss&&GLOSS_BY_ID[gloss]?GLOSS_BY_ID[gloss].term:(gloss==='list'?'Glossary':(cheat==='list'?'Quick reference':'Rulebook'))))))+'</a>';
  h += '<h1 class="sec-title">'+(s.part?esc(s.id)+' ':'')+esc(s.title)+'</h1>';
  h += '<p class="sec-part">'+(s.part?'Part '+esc(s.part)+' · '+esc(DATA.parts[s.part]):'')+'</p>';
  s.chunks.forEach(function(c,ci){
    h += '<p class="chunk '+(c.k==='li'?'li ':'')+(hits.has(ci)?'hit':'')+'" data-ci="'+ci+'">'+(ctx && ctx.re ? termText(c.t, ctx.re) : richText(c.t, stems))+'</p>';
  });
  var rel = (DATA.seealso||{})[id];
  if (rel && rel.length){
    h += '<h2 class="label">See also</h2><div class="toc topics qlist">';
    rel.forEach(function(r){ var t = SECTIONS[SEC_BY_ID[r]]; h += '<a class="trow" href="#s/'+r+'"><span class="tn"><span class="sid">'+esc(r)+'</span>'+esc(t.title)+'</span></a>'; });
    h += '</div>';
  }
  var prev = SECTIONS[si-1], next = SECTIONS[si+1];
  h += '<div class="pager">'+(prev?'<a href="#s/'+prev.id+'"><small>Previous</small>'+esc(prev.id)+' '+esc(prev.title)+'</a>':'<span style="flex:1"></span>')+
       (next?'<a class="next" href="#s/'+next.id+'"><small>Next</small>'+esc(next.id)+' '+esc(next.title)+'</a>':'<span style="flex:1"></span>')+'</div>';
  h += tocHtml(id);
  $main.innerHTML = h;
  var first = bestCi>=0 ? $main.querySelector('.chunk[data-ci="'+bestCi+'"]') : null;
  if (first) first.scrollIntoView({block:'center'}); else window.scrollTo(0,0);
}
/* Navigation keeps its own state (current = open section id, or null for search) and mirrors it to the
   URL hash when the page is allowed to, so the browser Back button works and sections can be bookmarked. */
var current = null, ack = false;
function parseHash(){ var m = /^#s\/(.+)$/.exec(location.hash); return m ? decodeURIComponent(m[1]) : null; }
function parseTopic(){ var m = /^#t\/(.+)$/.exec(location.hash); return m && TOPIC_BY_ID[decodeURIComponent(m[1])] ? decodeURIComponent(m[1]) : null; }
function parseCheat(){ var m = /^#c(?:\/(.+))?$/.exec(location.hash); return m ? (m[1] && CHEAT_BY_ID[decodeURIComponent(m[1])] ? decodeURIComponent(m[1]) : 'list') : null; }
function parseAck(){ return location.hash==='#a'; }
function parseGloss(){ var m = /^#g(?:\/(.+))?$/.exec(location.hash); return m ? (m[1] && GLOSS_BY_ID[decodeURIComponent(m[1])] ? decodeURIComponent(m[1]) : 'list') : null; }
function setHash(){ try { var h = current!==null ? 's/'+current : (topicView ? 't/'+topicView : (gloss ? (gloss==='list'?'g':'g/'+gloss) : (cheat ? (cheat==='list'?'c':'c/'+cheat) : (ack ? 'a' : '')))); if (location.hash.replace(/^#/,'')!==h) location.hash = h; } catch(e) {} }
function show(){
  if (current!==null){ renderSection(current); return; }
  renderSearch();
  if (restoreY!==null){ window.scrollTo(0,restoreY); restoreY=null; }
}
function nav(id){
  if (id!==null && current===null) savedY = window.scrollY;
  current = id; ack = false; show(); setHash();
}
function navAck(on){
  if (on && !ack) savedY = window.scrollY;
  ack = on; cheat = null; gloss = null; topicView = null; current = null; show(); setHash();
}
function navCheat(c){
  if (c!==null && cheat===null) savedY = window.scrollY;
  cheat = c; ack = false; gloss = null; topicView = null; current = null; show(); setHash();
}
function navGloss(g){
  if (g!==null && gloss===null) savedY = window.scrollY;
  gloss = g; ack = false; cheat = null; topicView = null; current = null; show(); setHash();
}
function navTopic(t){
  if (t!==null && topicView===null) savedY = window.scrollY;
  topicView = t; ack = false; gloss = null; cheat = null; current = null; show(); setHash();
}
window.addEventListener('hashchange', function(){
  var p = parseHash(), t = parseTopic(), g = parseGloss(), c = parseCheat(), a = parseAck();
  if (p!==current || (p===null && (t!==topicView || g!==gloss || c!==cheat || a!==ack))){
    if (p===null) restoreY = savedY;
    current = p; if (p===null){ topicView = t; gloss = g; cheat = c; ack = a; }
    show();
  }
});
document.addEventListener('click', function(e){
  var tf = e.target.closest && e.target.closest('.tfchip');
  if (tf){ var id = tf.getAttribute('data-t'); if (filters.has(id)) filters.delete(id); else filters.add(id); renderSearch(); return; }
  if (e.target.closest && e.target.closest('.tclear')){ filters.clear(); renderSearch(); return; }
  var chip = e.target.closest && e.target.closest('.chip');
  if (chip){ topicView = null; gloss = null; cheat = null; ack = false; $q.value = chip.getAttribute('data-q'); renderSearch(); window.scrollTo(0,0); return; }
  if (e.target.closest && e.target.closest('a.homelink')){ e.preventDefault(); goHome(); return; }
  var ak = e.target.closest && e.target.closest('a[href="#a"]');
  if (ak){ e.preventDefault(); navAck(true); return; }
  var ab = e.target.closest && e.target.closest('a.aback');
  if (ab){ e.preventDefault(); restoreY = savedY; navAck(false); return; }
  var ca = e.target.closest && e.target.closest('a[href^="#c"]');
  if (ca){ e.preventDefault(); var cv = ca.getAttribute('href'); navCheat(cv==='#c' ? 'list' : decodeURIComponent(cv.slice(3))); return; }
  var cb = e.target.closest && e.target.closest('a.cback');
  if (cb){ e.preventDefault(); restoreY = savedY; navCheat(cheat==='list' || !CHEAT_BY_ID[cheat] ? null : 'list'); return; }
  var ga = e.target.closest && e.target.closest('a[href^="#g"]');
  if (ga){ e.preventDefault(); var gv = ga.getAttribute('href'); navGloss(gv==='#g' ? 'list' : decodeURIComponent(gv.slice(3))); return; }
  var gb = e.target.closest && e.target.closest('a.gback');
  if (gb){ e.preventDefault(); restoreY = savedY; navGloss(gloss==='list' || !GLOSS_BY_ID[gloss] ? null : 'list'); return; }
  var ta = e.target.closest && e.target.closest('a[href^="#t/"]');
  if (ta){ e.preventDefault(); navTopic(decodeURIComponent(ta.getAttribute('href').slice(3))); return; }
  var a = e.target.closest && e.target.closest('a[href^="#s/"]');
  if (a){
    e.preventDefault();
    var sid = decodeURIComponent(a.getAttribute('href').slice(3));
    secCtx = null;
    if (current===null){
      if (gloss && GLOSS_BY_ID[gloss] && GLOSS_BY_ID[gloss].re) secCtx = {id:sid, re:GLOSS_BY_ID[gloss].re};
      else if (cheat && CHEAT_BY_ID[cheat]){ var qb = a.closest('.csi'); if (qb && qb.querySelector('blockquote')) secCtx = {id:sid, quote:qb.querySelector('blockquote').textContent}; }
    }
    nav(decodeURIComponent(a.getAttribute('href').slice(3))); return; }
  var tb = e.target.closest && e.target.closest('a.tback');
  if (tb){ e.preventDefault(); restoreY = savedY; navTopic(null); return; }
  var back = e.target.closest && e.target.closest('a.back');
  if (back){ e.preventDefault(); restoreY = savedY; nav(null); }
});
var timer = null;
$q.addEventListener('input', function(){
  clearTimeout(timer);
  timer = setTimeout(function(){ if ($q.value.trim()){ topicView = null; gloss = null; cheat = null; ack = false; } if (current!==null){ nav(null); } else { renderSearch(); setHash(); } }, 70);
});
function goHome(){
  $q.value=''; $q.blur(); topicView=null; gloss=null; cheat=null; ack=false; filters.clear(); lastQuery=''; lastSearch=null;
  SUGGEST = pickSuggest(); current=null; restoreY=null; show(); setHash(); window.scrollTo(0,0);
}
document.getElementById('clear').addEventListener('click', function(){ $q.value=''; topicView=null; gloss=null; cheat=null; ack=false; nav(null); $q.focus(); });
$q.addEventListener('keydown', function(e){ if (e.key==='Enter'){ $q.blur(); } });

window.rulebook = { search:function(q){ return search(q).results.map(function(r){ return {id:r.id, score:r.score}; }); }, sections:SECTIONS.map(function(s){ return s.id; }) };
current = parseHash(); if (current===null){ topicView = parseTopic(); gloss = parseGloss(); cheat = parseCheat(); ack = parseAck(); }
show();
})();
(function(){
  var b=document.getElementById('themebtn');
  function cur(){return document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';}
  function label(){b.textContent=cur()==='dark'?'Light mode':'Dark mode';}
  b.addEventListener('click',function(){
    var t=cur()==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',t);
    try{localStorage.setItem('theme',t);}catch(e){}
    label();
  });
  label();
})();
</script>
